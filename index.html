<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車輛過戶稅金分攤計算機</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Google Fonts (Noto Sans TC & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-100 selection:text-indigo-800">

    <!-- 主要內容區塊 -->
    <main class="w-full max-w-2xl mx-auto px-4 py-6 sm:py-10">
        
        <!-- 標題與說明卡片 -->
        <header class="mb-6 text-center sm:text-left flex flex-col sm:flex-row sm:items-end justify-between gap-2">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-semibold mb-2 border border-indigo-100">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
               <!--     <span>過戶稅金分攤計算機</span>  -->
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">過戶稅金分攤計算機</h1>
            </div>
            <div id="yearInfoBadge" class="inline-flex items-center self-center sm:self-end px-3 py-1.5 rounded-xl bg-white text-slate-600 text-xs font-medium shadow-sm border border-slate-200/80">
                <!-- 由 JS 動態填入年度天數資訊 -->
                計算基準：-- 年（-- 天）
            </div>
        </header>

        <!-- 輸入設定卡片 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 mb-6">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                基本資料輸入
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <!-- 欄位 1：過戶日期 -->
                <div>
                    <label for="transferDate" class="block text-sm font-semibold text-slate-700 mb-2">
                        過戶日期
                    </label>
                    <div class="relative">
                        <input 
                            type="date" 
                            id="transferDate" 
                            class="w-full rounded-xl border border-slate-300 bg-slate-50/50 px-4 py-3 text-base font-medium text-slate-900 focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all"
                        >
                    </div>
                    <p class="mt-1.5 text-xs text-slate-400">預設為今日日期，變更後自動重算天數</p>
                </div>

                <!-- 欄位 2：總稅額 -->
                <div>
                    <label for="totalTax" class="block text-sm font-semibold text-slate-700 mb-2">
                        總稅額（元）
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 font-medium pointer-events-none">
                            NT$
                        </span>
                        <input 
                            type="number" 
                            id="totalTax" 
                            inputmode="numeric"
                            step="1"
                            min="0"
                            placeholder="請輸入整數金額"
                            value=""
                            class="w-full rounded-xl border border-slate-300 bg-slate-50/50 pl-14 pr-4 py-3 text-base font-semibold text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:border-indigo-500 focus:outline-none focus:ring-4 focus:ring-indigo-500/10 transition-all"
                        >
                    </div>
                    <p class="mt-1.5 text-xs text-slate-400">僅計算整數金額（無小數點）</p>
                </div>
            </div>
        </section>

        <!-- 自動計算結果區（下方 4 欄） -->
        <section aria-label="分算結果" class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
            
            <!-- 賣方負擔卡片 -->
            <div class="bg-white rounded-2xl shadow-sm border border-amber-200/80 overflow-hidden flex flex-col">
                <div class="bg-amber-50/80 border-b border-amber-100 px-5 py-3.5 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <h3 class="font-bold text-amber-950 text-base">賣方負擔</h3>
                    </div>
                    <span class="text-xs font-medium text-amber-700 bg-amber-100/80 px-2.5 py-0.5 rounded-lg">
                        1/1 ～ 過戶日
                    </span>
                </div>

                <div class="p-5 space-y-4 flex-1 flex flex-col justify-center">
                    <!-- 欄位 3：賣方負擔天數 -->
                    <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-600">賣方負擔天數</span>
                        <div class="text-right">
                            <span id="sellerDays" class="text-xl font-bold text-slate-900 tabular-nums">0</span>
                            <span class="text-sm font-medium text-slate-500 ml-1">天</span>
                        </div>
                    </div>

                    <!-- 欄位 4：賣方負擔稅金 -->
                    <div class="bg-amber-50/40 rounded-xl p-4 border border-amber-100/80 flex items-center justify-between">
                        <span class="text-sm font-semibold text-amber-900">賣方負擔稅金</span>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-amber-700 mr-1">NT$</span>
                            <span id="sellerTax" class="text-2xl sm:text-3xl font-bold text-amber-700 tabular-nums">0</span>
                            <span class="text-sm font-medium text-amber-700 ml-1">元</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 買方負擔卡片 -->
            <div class="bg-white rounded-2xl shadow-sm border border-emerald-200/80 overflow-hidden flex flex-col">
                <div class="bg-emerald-50/80 border-b border-emerald-100 px-5 py-3.5 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                        <h3 class="font-bold text-emerald-950 text-base">買方負擔</h3>
                    </div>
                    <span class="text-xs font-medium text-emerald-700 bg-emerald-100/80 px-2.5 py-0.5 rounded-lg">
                        過戶日 ～ 12/31
                    </span>
                </div>

                <div class="p-5 space-y-4 flex-1 flex flex-col justify-center">
                    <!-- 欄位 5：買方負擔天數 -->
                    <div class="bg-slate-50 rounded-xl p-3.5 border border-slate-100 flex items-center justify-between">
                        <span class="text-sm font-medium text-slate-600">買方負擔天數</span>
                        <div class="text-right">
                            <span id="buyerDays" class="text-xl font-bold text-slate-900 tabular-nums">0</span>
                            <span class="text-sm font-medium text-slate-500 ml-1">天</span>
                        </div>
                    </div>

                    <!-- 欄位 6：買方負擔稅金 -->
                    <div class="bg-emerald-50/40 rounded-xl p-4 border border-emerald-100/80 flex items-center justify-between">
                        <span class="text-sm font-semibold text-emerald-900">買方負擔稅金</span>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-emerald-700 mr-1">NT$</span>
                            <span id="buyerTax" class="text-2xl sm:text-3xl font-bold text-emerald-700 tabular-nums">0</span>
                            <span class="text-sm font-medium text-emerald-700 ml-1">元</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 操作按鈕與計算公式說明 -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5">
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div class="text-xs text-slate-500 space-y-1">
                    <p>• 賣方天數 = 過戶日期與 1/1 之日數差 + 1 天（含過戶日）；買方天數 = 12/31 與過戶日期之日數差</p>
                    <p>• 負擔稅金 = 總稅額 ÷ 當年度總天數 × 各自負擔天數（四捨五入取整數）</p>
                </div>

                <div class="flex items-center gap-2.5 shrink-0">
                    <button 
                        type="button" 
                        id="resetBtn"
                        class="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 text-sm font-semibold hover:bg-slate-50 active:bg-slate-100 transition-colors cursor-pointer"
                    >
                        重設今日
                    </button>
                    <button 
                        type="button" 
                        id="copyBtn"
                        class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 active:bg-indigo-800 shadow-sm transition-colors cursor-pointer"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        <span>複製明細</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- 提示訊息框 (Toast Notification，取代 alert) -->
    <div id="toastMessage" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-2">
        <div class="bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span id="toastText">已複製分算明細至剪貼簿</span>
        </div>
    </div>

    <script>
        /**
         * 取得本地時間今日的 YYYY-MM-DD 格式字串
         * 避免使用 toISOString() 造成 UTC 時區日期偏移
         */
        function getTodayLocalString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /**
         * 判斷是否為閏年並回傳該年度總天數（365 或 366）
         * @param {number} year - 西元年
         * @returns {number} 當年度總天數
         */
        function getDaysInYear(year) {
            const isLeap = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            return isLeap ? 366 : 365;
        }

        /**
         * 將 YYYY-MM-DD 字串安全解析為本地時間的 Date 物件（午夜 00:00:00）
         * @param {string} dateStr - YYYY-MM-DD 格式日期
         * @returns {Date|null}
         */
        function parseLocalDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.split('-');
            if (parts.length !== 3) return null;
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const date = new Date(year, month, day);
            return isNaN(date.getTime()) ? null : date;
        }

        /**
         * 格式化整數顯示（加上千分位逗號，確保無小數點）
         * @param {number} num
         * @returns {string}
         */
        function formatInteger(num) {
            const cleanInt = Math.round(Number(num) || 0);
            return cleanInt.toLocaleString('zh-TW', { maximumFractionDigits: 0 });
        }

        /**
         * 顯示底部提示訊息（取代 alert）
         * @param {string} message
         */
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');
            toastText.textContent = message;

            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2500);
        }

        // 取得 DOM 元素參照
        const transferDateInput = document.getElementById('transferDate');
        const totalTaxInput = document.getElementById('totalTax');
        const sellerDaysEl = document.getElementById('sellerDays');
        const sellerTaxEl = document.getElementById('sellerTax');
        const buyerDaysEl = document.getElementById('buyerDays');
        const buyerTaxEl = document.getElementById('buyerTax');
        const yearInfoBadge = document.getElementById('yearInfoBadge');
        const resetBtn = document.getElementById('resetBtn');
        const copyBtn = document.getElementById('copyBtn');

        // 儲存目前計算狀態供複製功能使用
        let currentState = {
            dateStr: '',
            year: 0,
            daysInYear: 365,
            totalTax: 0,
            sellerDays: 0,
            sellerTax: 0,
            buyerDays: 0,
            buyerTax: 0
        };

        /**
         * 核心計算函式：當過戶日期或總稅額變動時自動執行
         */
        function calculateProration() {
            const dateStr = transferDateInput.value;
            const transferDate = parseLocalDate(dateStr);

            // 取得總稅額並確保為非負整數（若為空值則視為 0）
            const rawTaxValue = totalTaxInput.value.trim();
            const parsedTax = rawTaxValue === '' ? 0 : Math.max(0, Math.round(Number(rawTaxValue)));

            // 若日期無效，將所有結果歸零
            if (!transferDate) {
                sellerDaysEl.textContent = '0';
                sellerTaxEl.textContent = '0';
                buyerDaysEl.textContent = '0';
                buyerTaxEl.textContent = '0';
                yearInfoBadge.textContent = '計算基準：請選擇有效過戶日期';
                return;
            }

            const year = transferDate.getFullYear();
            const daysInYear = getDaysInYear(year);
            const isLeap = daysInYear === 366;

            // 更新年度資訊標籤
            yearInfoBadge.textContent = `計算基準：${year} 年（${isLeap ? '閏年' : '平年'} ${daysInYear} 天）`;

            // 設定當年度第一天 (1/1) 與最後一天 (12/31)
            const startOfYear = new Date(year, 0, 1);
            const endOfYear = new Date(year, 11, 31);
            const msPerDay = 1000 * 60 * 60 * 24;

            // 計算賣方負擔天數（1/1 與過戶日期之整數天數差 + 1 天，即包含過戶日當天）
            const sellerDays = Math.round((transferDate - startOfYear) / msPerDay) + 1;

            // 計算買方負擔天數（12/31 與過戶日期之整數天數差）
            const buyerDays = Math.round((endOfYear - transferDate) / msPerDay);

            // 計算各自負擔稅金並取整數（無小數點）
            const sellerTax = parsedTax > 0 ? Math.round((parsedTax / daysInYear) * sellerDays) : 0;
            const buyerTax = parsedTax > 0 ? Math.round((parsedTax / daysInYear) * buyerDays) : 0;

            // 更新畫面上的 4 個結果欄位（皆為整數）
            sellerDaysEl.textContent = formatInteger(sellerDays);
            sellerTaxEl.textContent = formatInteger(sellerTax);
            buyerDaysEl.textContent = formatInteger(buyerDays);
            buyerTaxEl.textContent = formatInteger(buyerTax);

            // 同步更新目前狀態
            currentState = {
                dateStr,
                year,
                daysInYear,
                totalTax: parsedTax,
                sellerDays,
                sellerTax,
                buyerDays,
                buyerTax
            };
        }

        /**
         * 防止總稅額輸入小數點或負號，確保輸入體驗為純整數
         */
        totalTaxInput.addEventListener('keydown', (e) => {
            if (e.key === '.' || e.key === '-' || e.key === '+' || e.key === 'e' || e.key === 'E') {
                e.preventDefault();
            }
        });

        // 監聽輸入事件，即時更新下方 4 欄
        transferDateInput.addEventListener('input', calculateProration);
        transferDateInput.addEventListener('change', calculateProration);
        totalTaxInput.addEventListener('input', () => {
            // 若貼上含小數點的數字，自動轉為整數
            if (totalTaxInput.value.includes('.')) {
                totalTaxInput.value = Math.round(Number(totalTaxInput.value)) || '';
            }
            calculateProration();
        });

        // 重設按鈕：過戶日期設回今日，總稅額清空
        resetBtn.addEventListener('click', () => {
            transferDateInput.value = getTodayLocalString();
            totalTaxInput.value = '';
            calculateProration();
            showToast('已重設為今日日期並清空總稅額');
        });

        // 複製明細按鈕：使用 document.execCommand('copy') 確保相容性
        copyBtn.addEventListener('click', () => {
            if (!currentState.dateStr) {
                showToast('請先選擇過戶日期');
                return;
            }

            const summaryText = [
                `【過戶稅金分算明細】`,
                `過戶日期：${currentState.dateStr}（${currentState.year}年共${currentState.daysInYear}天）`,
                `總稅額：${formatInteger(currentState.totalTax)} 元`,
                `賣方負擔天數：${formatInteger(currentState.sellerDays)} 天`,
                `賣方負擔稅金：${formatInteger(currentState.sellerTax)} 元`,
                `買方負擔天數：${formatInteger(currentState.buyerDays)} 天`,
                `買方負擔稅金：${formatInteger(currentState.buyerTax)} 元`
            ].join('\n');

            const textArea = document.createElement('textarea');
            textArea.value = summaryText;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                document.execCommand('copy');
                showToast('已複製分算明細至剪貼簿');
            } catch (err) {
                showToast('複製失敗，請手動選取複製');
            } finally {
                document.body.removeChild(textArea);
            }
        });

        // 頁面載入初始化：設定過戶日期預設為今日、總稅額為空值並執行初次計算
        window.addEventListener('DOMContentLoaded', () => {
            transferDateInput.value = getTodayLocalString();
            totalTaxInput.value = '';
            calculateProration();
        });
    </script>
</body>
</html>
